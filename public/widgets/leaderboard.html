<!--
  Tikkies Tools — Leaderboard Widget (อันดับผู้ให้ของขวัญ สำหรับ แหล่งภาพชนิดเว็บของโปรแกรมไลฟ์)

  วิธีใช้:
    เพิ่ม http://localhost:21213/widgets/leaderboard.html เป็น แหล่งภาพชนิดเว็บในโปรแกรมไลฟ์
    (พื้นหลังโปร่งใส แนะนำขนาดกว้าง 340 สูง 400)

  พารามิเตอร์ (ต่อท้าย URL):
    ?top=5           จำนวนอันดับที่แสดง (ค่าเริ่มต้น 5)
    ?layout=podium   3 อันดับแรกเป็นการ์ดโพเดียมมีมงกุฎ (อันดับ 4 ลงไปเป็นแถวเหมือนเดิม)
    ?rank1= ?rank2= ?rank3=  สีการ์ดแต่ละอันดับ เป็น hex (ค่าเริ่มต้นโทนพาสเทล)
    ?podav=58        ขนาดรูปบนการ์ดโพเดียม (px)
    ?crown=0         ไม่เอามงกุฎเหนือการ์ด
    ?title=ข้อความ   เปลี่ยนหัวข้อ; ?title=0 เพื่อซ่อนหัวข้อ
    ?host= / ?port=  กรณีเปิดจากเครื่อง/พอร์ตอื่น (ค่าเริ่มต้น localhost:21213)

  ข้อมูล: ฟัง event 'leaderboard' และตั้งค่าเริ่มต้นจาก snapshot.leaderboard
-->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tikkies — Leaderboard</title>
<!-- ธีม + ตัวปรับหน้าตา: ต้องรันก่อน CSS จะได้ไม่เห็นของเดิมแวบหนึ่งก่อนสลับ -->
<script src="common/look.js"></script>
<link rel="stylesheet" href="common/templates.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: var(--tpl-font);
    color: #ececf1;
  }
  #board { padding: 12px; max-width: var(--tpl-width, 450px); }
  .title {
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 12px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  #rows { position: relative; }

  /* ---------- โหมดโพเดียม (?layout=podium) ----------
     3 อันดับแรกยกขึ้นเป็นการ์ดมีมงกุฎ อันดับ 1 อยู่กลางและสูงกว่าเพื่อน
     อันดับ 4 ลงไปยังเป็นแถวเหมือนเดิม เพราะการ์ดกินที่มาก ถ้าทำทุกอันดับจะล้นจอ

     ทำไมไม่ใช้สีทึบสีเดียว: สีแบนๆ อ่านเป็นงานสำเร็จรูป การ์ดรางวัลที่ดูมีราคาได้มาจาก
     "แสงตกจากด้านบน" — ขอบบนสว่าง ท้องการ์ดเข้ม ขอบในบางๆ คั่น แล้วมีเงาจริงรองข้างล่าง
     เฉดอ่อน/เข้มคำนวณจากสีที่ผู้ใช้เลือกเอง (ดู TikkiesWidget.shade) ผู้ใช้จึงยังคุมสีได้
     แต่ได้มิติมาให้ฟรีโดยไม่ต้องเลือกสีเองสามค่า */
  #podium { display: none; }
  [data-layout="podium"] #podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: var(--podgap, 10px);
    margin-bottom: 14px;
    padding-top: 6px;
  }
  .pod { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }

  .pcard {
    width: 100%;
    position: relative;
    border-radius: 16px;
    padding: 15px 7px 12px;
    text-align: center;
    background: linear-gradient(177deg, var(--pod-hi) 0%, var(--pod-c) 45%, var(--pod-lo) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.85),   /* เส้นแสงขอบบน = ตัวที่ทำให้ดูมีผิว ไม่ใช่สี่เหลี่ยมสี */
      inset 0 -1px 0 rgba(0, 0, 0, 0.14),
      0 0 0 1px rgba(255, 255, 255, 0.28),       /* ขอบบางๆ คั่นการ์ดออกจากฉากมืดข้างหลัง */
      0 10px 22px rgba(0, 0, 0, 0.42);
    overflow: hidden;
  }
  /* อันดับ 1 สูงกว่า กว้างกว่า และมีแสงเรืองสีตัวเอง — เห็นปุ๊บรู้เลยว่าใครที่หนึ่ง */
  .pod[data-slot="1"] { flex-grow: 1.3; }
  .pod[data-slot="1"] .pcard {
    padding: 22px 8px 16px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 0 rgba(0, 0, 0, 0.16),
      0 0 0 1px rgba(255, 255, 255, 0.34),
      0 14px 30px rgba(0, 0, 0, 0.48),
      0 0 30px var(--pod-glow);
  }
  /* แสงกวาดผ่านการ์ดที่หนึ่งช้าๆ — รายละเอียดที่ทำให้ดูเป็นของมีราคา ไม่ใช่ภาพนิ่ง
     ปิดตามได้ด้วย ?anim=0 เหมือน widget อื่น (กฎรวมอยู่ใน templates.css) */
  .pod[data-slot="1"] .pcard::after {
    content: '';
    position: absolute; top: -60%; bottom: -60%; left: -40%; width: 28%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    transform: rotate(8deg);
    animation: podShine 5.5s ease-in-out 1.2s infinite;
    pointer-events: none;
  }
  @keyframes podShine { 0% { left: -40%; } 55%, 100% { left: 130%; } }

  .pav {
    width: var(--podav, 58px); height: var(--podav, 58px);
    margin: 0 auto 17px;
    border-radius: 50%;
    overflow: hidden; position: relative;
    display: grid; place-items: center;
    font-weight: 800; font-size: 22px; color: #fff;
    /* วงแหวนสองชั้น: ขาวด้านใน + เฉดเข้มของสีอันดับด้านนอก ให้รูปดูจมลงไปในการ์ด */
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.9),
      0 0 0 5px var(--pod-lo),
      0 3px 8px rgba(0, 0, 0, 0.3);
  }
  .pod[data-slot="1"] .pav { width: calc(var(--podav, 58px) * 1.2); height: calc(var(--podav, 58px) * 1.2); }
  .pav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* เหรียญเลขอันดับ คร่อมขอบล่างของรูป */
  .pmedal {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--podav, 58px) * 0.78 + 15px);
    width: 27px; height: 27px; border-radius: 50%;
    background: linear-gradient(180deg, var(--pod-hi), var(--pod-lo));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      0 0 0 2px rgba(255, 255, 255, 0.9),
      0 2px 6px rgba(0, 0, 0, 0.45);
    display: grid; place-items: center;
    font-weight: 900; font-size: 14px; color: rgba(0, 0, 0, 0.75);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    font-variant-numeric: tabular-nums;
  }
  .pod[data-slot="1"] .pmedal {
    top: calc(var(--podav, 58px) * 1.2 * 0.78 + 22px);
    width: 31px; height: 31px; font-size: 16px;
  }

  /* ตัวอักษรบนการ์ดสีอ่อนต้องเป็นสีเข้ม ไม่ใช่ขาวเหมือนแถวปกติ ไม่งั้นอ่านไม่ออก
     เงาขาวบางๆ ใต้ตัวอักษรทำให้ดูเหมือนพิมพ์ลงบนผิวการ์ด ไม่ใช่ลอยอยู่ข้างบน */
  .pname {
    position: relative; z-index: 1;
    color: rgba(0, 0, 0, 0.82); font-weight: 700; font-size: 13px;
    letter-spacing: .1px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 2px;
  }
  .pod[data-slot="1"] .pname { font-size: 14px; font-weight: 800; }
  .pdia {
    position: relative; z-index: 1;
    color: rgba(0, 0, 0, 0.74); font-weight: 800; font-size: 14px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    font-variant-numeric: tabular-nums; margin-top: 3px;
  }
  .pod[data-slot="1"] .pdia { font-size: 16px; }

  .pod .crown {
    width: var(--crown, 26px); height: auto;
    display: block; margin-bottom: -5px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  }
  .pod[data-slot="1"] .crown { width: calc(var(--crown, 26px) * 1.35); }
  .pod.empty-slot { visibility: hidden; }   /* ยังไม่ครบ 3 คน — เว้นที่ไว้ ไม่ให้การ์ดที่เหลือขยับ */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--pan-bg, rgba(18, 18, 22, 0.6));
    border: var(--pan-border, 0 solid transparent);
    border-radius: var(--pan-radius, 12px);
    box-shadow: var(--pan-shadow, none);
    padding: var(--pan-pad, 8px 12px);
    margin-bottom: var(--rowgap, 8px);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
  }
  .row.enter { opacity: 0; transform: translateY(8px); }
  .rank {
    flex: 0 0 auto;
    width: 26px; text-align: center;
    font-weight: 800; font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .avatar {
    flex: 0 0 auto;
    width: var(--av, 38px); height: var(--av, 38px);
    border-radius: 50%;
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    position: relative; overflow: hidden;
  }
  /* รูปจริงซ้อนทับตัวอักษร — โหลดพังจะถูก onerror ลบทิ้ง เหลือตัวอักษรให้เห็น */
  .avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 50%;
  }
  .name {
    flex: 1 1 auto;
    min-width: 0;
    color: var(--tpl-text, inherit);
    font-weight: 600; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }
  .diamonds {
    flex: 0 0 auto;
    font-weight: 700; font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--valuecolor, #7ce9ff);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  /* อันดับ 1 เด่นกว่า + ขอบทอง */
  .row.top1 {
    background: linear-gradient(90deg, var(--accent-weak, rgba(255, 190, 70, 0.22)), var(--pan-bg, rgba(18, 18, 22, 0.6)));
    box-shadow: inset 0 0 0 1.5px var(--accent-ring, rgba(255, 200, 90, 0.7));
  }
  /* อันดับ 1 รูปใหญ่กว่าเล็กน้อย — คิดจากขนาดที่ผู้ใช้ตั้ง ไม่ใช่เลขตายตัว */
  .row.top1 .avatar { width: calc(var(--av, 38px) * 1.16); height: calc(var(--av, 38px) * 1.16); }
  .row.top1 .name { font-size: 16px; }
  .empty { opacity: 0.6; font-size: 14px; padding: 8px 4px; }

  /* ================= ธีม (?template=) ================= */

  /* neon — แถวเป็นแถบเหลี่ยม ขีดเรืองแสงหน้าแถว อันดับเป็นตัวเลขนีออน */
  [data-tpl="neon"] .row {
    background: rgba(6, 6, 12, 0.6);
    border-radius: 2px;
    border-left: 3px solid var(--accent, #fe2c55);
    box-shadow: -1px 0 12px var(--accent-weak, rgba(254,44,85,.22));
  }
  [data-tpl="neon"] .rank {
    color: var(--accent, #fe2c55);
    text-shadow: 0 0 10px var(--accent-glow, rgba(254,44,85,.55));
  }
  [data-tpl="neon"] .avatar { border-radius: 2px; box-shadow: 0 0 0 1px var(--accent, #fe2c55); }
  [data-tpl="neon"] .avatar img { border-radius: 2px; }
  [data-tpl="neon"] .name { text-transform: uppercase; letter-spacing: .05em; font-size: 13.5px; }
  [data-tpl="neon"] .title {
    text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent, #fe2c55);
    text-shadow: 0 0 12px var(--accent-glow, rgba(254,44,85,.55));
  }
  [data-tpl="neon"] .row.top1 {
    background: rgba(6, 6, 12, 0.82);
    box-shadow: -1px 0 20px var(--accent-glow, rgba(254,44,85,.55)), inset 0 0 22px var(--accent-weak, rgba(254,44,85,.22));
  }

  /* glass — การ์ดกระจกมนๆ อันดับเป็นเหรียญกลม */
  [data-tpl="glass"] .row {
    background: var(--pan-bg);
    border: var(--pan-border);
    border-radius: 999px;
    box-shadow: var(--pan-shadow);
    backdrop-filter: var(--pan-blur);
    -webkit-backdrop-filter: var(--pan-blur);
    padding: 7px 14px 7px 8px;
  }
  [data-tpl="glass"] .rank {
    width: 24px; height: 24px; line-height: 24px;
    border-radius: 50%; font-size: 13px;
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
  }
  [data-tpl="glass"] .avatar { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  [data-tpl="glass"] .title { font-weight: 650; color: #fff; }
  [data-tpl="glass"] .row.top1 {
    background: rgba(255, 255, 255, 0.24);
    box-shadow: 0 0 0 1px rgba(255,255,255,.45), 0 8px 26px rgba(0,0,0,.3);
  }
  [data-tpl="glass"] .row.top1 .rank { background: #fff; color: #1a1a22; }

  /* arcade — แถวเป็นบล็อกขอบหนา อันดับเป็นป้ายพื้นทึบ */
  [data-tpl="arcade"] .row {
    background: #12121c;
    border: 3px solid #fff;
    border-radius: 0;
    box-shadow: 4px 4px 0 rgba(0,0,0,.85);
    margin-bottom: 10px;
  }
  [data-tpl="arcade"] .rank {
    background: var(--accent, #fe2c55);
    color: #fff; width: 26px; height: 26px; line-height: 26px;
    font-size: 14px; text-shadow: 2px 2px 0 rgba(0,0,0,.6);
  }
  [data-tpl="arcade"] .avatar { border-radius: 0; border: 2px solid #fff; }
  [data-tpl="arcade"] .avatar img { border-radius: 0; }
  [data-tpl="arcade"] .name { font-size: 13px; }
  [data-tpl="arcade"] .title { text-transform: uppercase; letter-spacing: .06em; }
  [data-tpl="arcade"] .row.top1 {
    background: #1c1c2c;
    border-color: var(--accent, #fe2c55);
    box-shadow: 4px 4px 0 rgba(0,0,0,.85), inset 0 0 0 2px rgba(255,255,255,.15);
  }
  [data-tpl="neon"] .diamonds { color: #7ce9ff; text-shadow: 0 0 10px rgba(124,233,255,.6); }
  [data-tpl="glass"] .diamonds { color: #fff; }
  [data-tpl="arcade"] .diamonds { color: #7ce9ff; text-shadow: 2px 2px 0 rgba(0,0,0,.9); }

  /* plain — อันดับ 1 เดิมเน้นด้วยแถบไล่สีทอง ซึ่งเป็นพื้นหลังเต็มแถว
   * ธีมนี้ไม่มีพื้นหลัง จึงย้ายการเน้นไปที่ตัวอักษรแทน: ชื่อเป็นสีทองและตัวใหญ่ขึ้น
   * (รูปที่ใหญ่กว่าแถวอื่นยังอยู่ ช่วยบอกอันดับ 1 อีกทาง) */
  [data-tpl="plain"] .row.top1 { background: none; box-shadow: none; }
  [data-tpl="plain"] .row.top1 .name { color: var(--accent-ring, rgba(255, 200, 90, 1)); }
</style>
</head>
<body>
  <div id="board">
    <div class="title" id="title"></div>
    <div id="podium">
      <div class="pod" data-slot="2"></div>
      <div class="pod" data-slot="1"></div>
      <div class="pod" data-slot="3"></div>
    </div>
    <div id="rows"><div class="empty" id="empty"></div></div>
  </div>

  <script src="common/widget.js"></script>
  <script>
  (function () {
    var params = TikkiesWidget.params;
    var T = TikkiesWidget.T;   // ค่าเริ่มต้นตามภาษาที่ผู้ใช้ตั้งไว้ในโปรแกรม
    var esc = TikkiesWidget.escapeHtml;
    var safeUrl = TikkiesWidget.safeUrl;

  // ?avatarsize= ขนาดรูปโปรไฟล์, ?rowgap= ระยะห่างระหว่างแถว, ?valuecolor= สีตัวเลขท้ายแถว
  (function () {
    var P2 = TikkiesWidget.params, R = document.documentElement.style;
    function n2(k, min, max) { var v = P2.get(k); if (v == null || v === '') return null; v = Number(v); return isFinite(v) ? Math.min(max, Math.max(min, v)) : null; }
    var av = n2('avatarsize', 0, 120); if (av != null) R.setProperty('--av', av + 'px');
    var rg = n2('rowgap', 0, 40); if (rg != null) R.setProperty('--rowgap', rg + 'px');
    var vc = String(P2.get('valuecolor') || '').replace(/^#/, '');
    if (/^[0-9a-f]{3}$|^[0-9a-f]{6}$/i.test(vc)) R.setProperty('--valuecolor', '#' + vc);
  })();
    var fmt = TikkiesWidget.formatNumber;

    var topN = parseInt(params.get('top'), 10);
    if (!(topN > 0)) topN = 5;

    // ---------- โหมดโพเดียม ----------
    var PODIUM = params.get('layout') === 'podium';
    var podEls = {};
    if (PODIUM) {
      document.documentElement.dataset.layout = 'podium';
      [1, 2, 3].forEach(function (n) {
        podEls[n] = document.querySelector('#podium .pod[data-slot="' + n + '"]');
      });
      // สีรายอันดับ — รับเฉพาะ hex เท่านั้น ค่านี้มาจาก URL ที่ผู้ใช้แก้เองได้
      // ถ้าปล่อยค่าดิบลง CSS จะแทรกกฎอื่นต่อท้ายได้ (เช่น 'red;position:fixed;inset:0')
      var HEX = /^#?[0-9a-f]{3,8}$/i;
      var DEF = { 1: '#f6e58d', 2: '#ded3f5', 3: '#f8c8a0' };   // พาสเทล: เหลือง ม่วง ส้ม
      [1, 2, 3].forEach(function (n) {
        var raw = String(params.get('rank' + n) || '').trim();
        var c = HEX.test(raw) ? (raw.charAt(0) === '#' ? raw : '#' + raw) : DEF[n];
        if (!podEls[n]) return;
      var st = podEls[n].style;
      st.setProperty('--pod-c', c);
      st.setProperty('--pod-hi', TikkiesWidget.shade(c, 0.38));   // ขอบบนที่โดนแสง
      st.setProperty('--pod-lo', TikkiesWidget.shade(c, -0.26));  // ท้องการ์ดที่อยู่ในเงา
      st.setProperty('--pod-glow', TikkiesWidget.rgba(c, 0.45));  // แสงเรืองของอันดับ 1
      });
      if (params.get('crown') === '0') {
        var cs = document.createElement('style');
        cs.textContent = '.pod .crown { display: none; }';
        document.head.appendChild(cs);
      }
      var av = parseInt(params.get('podav'), 10);
      if (av > 0) document.documentElement.style.setProperty('--podav', Math.min(160, Math.max(28, av)) + 'px');
    }

    // ?avatars=0 — ซ่อนรูปโปรไฟล์ (เหลือแค่อันดับ+ชื่อ+เพชร)
    if (params.get('avatars') === '0') {
      var st = document.createElement('style');
      st.textContent = '.avatar { display: none; }';
      document.head.appendChild(st);
    }

    var titleParam = params.get('title');
    var titleEl = document.getElementById('title');
    if (titleParam === '0') {
      titleEl.style.display = 'none';
    } else {
      titleEl.textContent = titleParam || T('🏆 ท็อปผู้สนับสนุน', '🏆 Top supporters');
    }

    var rowsEl = document.getElementById('rows');
    var emptyEl = document.getElementById('empty');
  // ตั้งตอนรัน ไม่ฝังใน markup — markup เปลี่ยนตามภาษาที่ผู้ใช้เลือกไม่ได้
  if (emptyEl) emptyEl.textContent = T('ยังไม่มีผู้ให้ของขวัญ', 'No gifts yet');
    var MEDALS = ['🥇', '🥈', '🥉'];
    // ต้องเป็น Map ไม่ใช่ object ธรรมดา — key คือ uniqueId ที่ผู้ชมตั้งเองได้ ถ้าไปตรงกับชื่อบน
    // Object.prototype (constructor / toString / __proto__ ...) การอ่านค่าจะได้ของที่สืบทอดมา
    // แทน undefined โค้ดจะหลงคิดว่ามีแถวนั้นแล้ว → insertBefore โยน error (ถูก try/catch กลืน)
    // แล้วกระดานค้างถาวรกลางไลฟ์โดยไม่มีอะไรฟ้อง
    var rowByKey = new Map(); // uniqueId -> element (เก็บไว้ทำ animate FLIP)

    // สีวงกลม fallback จาก hash ของ uniqueId (เหมือน widget chat)
    function colorFor(id) {
      var h = 0, s = String(id || '?');
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
      return 'hsl(' + h + ', 55%, 45%)';
    }

    function buildRow(item, idx) {
      var row = document.createElement('div');
      row.className = 'row enter' + (!PODIUM && idx === 0 ? ' top1' : '');
      // โหมดโพเดียมกินอันดับ 1-3 ไปแล้ว แถวที่เหลือต้องเริ่มนับที่ 4 ไม่ใช่ 1
      var rank = idx + 1 + PODIUM_N;
      var rankTxt = (!PODIUM && idx < 3) ? MEDALS[idx] : String(rank);
      // String() ก่อน trim — ผู้ชม (หรือ payload ปลอม) ส่ง nickname เป็น number มาได้
      // ถ้าไม่ครอบ .trim() จะโยน TypeError แล้วกระดานค้างถาวรกลางไลฟ์
      var initial = esc(String(item.nickname || item.uniqueId || '?').trim().charAt(0) || '?');
      // วางตัวอักษร+สีเป็นพื้นเสมอ แล้วซ้อน <img> ทับ — รูปโหลดพัง (ลิงก์ TikTok หมดอายุ/โดนบล็อค)
      // ก็ยังเห็นตัวอักษรแทนที่จะเป็นวงกลมว่างเปล่า
      // safeUrl ก่อนเสมอ — รูปโปรไฟล์มาจากผู้ชม ถ้า scheme แปลกให้ทิ้งไปเหลือตัวอักษรแทน (กัน beacon/IP leak)
      var avUrl = safeUrl(item.profilePictureUrl);
      var avatarImg = avUrl
        ? '<img src="' + esc(avUrl) + '" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">'
        : '';
      row.innerHTML =
        '<div class="rank">' + rankTxt + '</div>' +
        '<div class="avatar" style="background-color:' + colorFor(item.uniqueId) + '">' +
          initial + avatarImg + '</div>' +
        '<div class="name">' + esc(item.nickname || item.uniqueId || T('ไม่ทราบชื่อ', 'Unknown')) + '</div>' +
        '<div class="diamonds">💎 ' + fmt(item.diamonds || 0) + '</div>';
      return row;
    }

    // มงกุฎ 3 ยอด มุมมนด้วย stroke-linejoin — เส้นขอบเป็นสีเดียวกับตัว จึงแค่ทำให้ยอดไม่แหลมคม
    // ไม่ได้ทำให้ดูเป็นเส้นขอบ · currentColor = รับสีจาก .crown ซึ่งอิงสีของการ์ดอันดับนั้น
    function crownSvg(slot) {
      return '<svg class="crown" viewBox="0 0 28 20" fill="none" aria-hidden="true">' +
      // ไล่เฉดในตัวมงกุฎเอง — ทองแบนๆ อ่านเป็นคลิปอาร์ต ทองที่มีอ่อน-เข้มอ่านเป็นโลหะ
      // id ต้องไม่ซ้ำกันระหว่างการ์ดสามใบ ไม่งั้นทั้งสามจะไปใช้เฉดของใบแรกใบเดียว
      '<defs><linearGradient id="cg' + slot + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--pod-hi)"/><stop offset="1" stop-color="var(--pod-lo)"/>' +
      '</linearGradient></defs>' +
      '<g fill="url(#cg' + slot + ')" stroke="url(#cg' + slot + ')">' +
      '<path d="M4.2 14.4 L2.4 4.6 L9.4 9.8 L14 1.8 L18.6 9.8 L25.6 4.6 L23.8 14.4 Z" ' +
      'stroke-width="1.8" stroke-linejoin="round"/>' +
      '<circle cx="2.4" cy="4.2" r="1.9"/><circle cx="14" cy="1.9" r="2.1"/><circle cx="25.6" cy="4.2" r="1.9"/>' +
      '<rect x="3.4" y="14" width="21.2" height="4" rx="2"/>' +
      '</g></svg>';
    }

    // อันดับที่โพเดียมกินไป (0 = ไม่ใช้โพเดียม) — อันดับที่เหลือลงไปอยู่ในแถวปกติ
    var PODIUM_N = PODIUM ? 3 : 0;

    function fillPod(slot, item) {
      var pod = podEls[slot];
      if (!pod) return;
      if (!item) { pod.classList.add('empty-slot'); pod.innerHTML = ''; return; }
      pod.classList.remove('empty-slot');
      var avUrl = safeUrl(item.profilePictureUrl);
      var initial = esc(String(item.nickname || item.uniqueId || '?').trim().charAt(0) || '?');
      var img = avUrl
        ? '<img src="' + esc(avUrl) + '" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">'
        : '';
      // เขียนใหม่เฉพาะตอนเนื้อหาเปลี่ยนจริง — ไม่งั้นทุก event ที่เข้ามา <img> จะถูกสร้างใหม่
      // แล้วรูปกะพริบทั้งกระดานตลอดไลฟ์ (กระดานอัปเดตทุกครั้งที่มีคนส่งของขวัญ)
      var sig = slot + '|' + (item.uniqueId || '') + '|' + (item.nickname || '') + '|' + (item.diamonds || 0) + '|' + avUrl;
      if (pod.dataset.sig === sig) return;
      pod.dataset.sig = sig;
      pod.innerHTML =
        crownSvg(slot) +
        '<div class="pcard">' +
          '<div class="pav" style="background-color:' + colorFor(item.uniqueId) + '">' + initial + img + '</div>' +
          '<div class="pmedal">' + slot + '</div>' +
          '<div class="pname">' + esc(item.nickname || item.uniqueId || T('ไม่ทราบชื่อ', 'Unknown')) + '</div>' +
          '<div class="pdia">💎 ' + fmt(item.diamonds || 0) + '</div>' +
        '</div>';
    }

    function render(top) {
      top = Array.isArray(top) ? top.slice(0, topN) : [];
      emptyEl.style.display = top.length ? 'none' : '';

      if (PODIUM) {
        fillPod(1, top[0]); fillPod(2, top[1]); fillPod(3, top[2]);
        top = top.slice(PODIUM_N);
      }

      // ตำแหน่งเดิม (สำหรับ FLIP animate)
      var firstPos = new Map();
      rowByKey.forEach(function (el, k) {
        firstPos.set(k, el.getBoundingClientRect().top);
      });

      var seen = new Set();
      var prevRow = null;
      top.forEach(function (item, idx) {
        var key = item.uniqueId || ('idx' + idx);
        seen.add(key);
        var row = rowByKey.get(key);
        if (!row) {
          row = buildRow(item, idx);
          rowByKey.set(key, row);
          // แทรกตามลำดับ
          if (prevRow && prevRow.nextSibling) rowsEl.insertBefore(row, prevRow.nextSibling);
          else rowsEl.appendChild(row);
          setTimeout(function () { row.classList.remove('enter'); }, 0);
        } else {
          // อัปเดตเนื้อหา/อันดับ
          var fresh = buildRow(item, idx);
          fresh.classList.remove('enter');
          row.className = fresh.className;
          row.innerHTML = fresh.innerHTML;
          // ย้ายให้อยู่ถูกลำดับ
          if (prevRow) { if (prevRow.nextSibling !== row) rowsEl.insertBefore(row, prevRow.nextSibling); }
          else if (rowsEl.firstChild !== row) rowsEl.insertBefore(row, rowsEl.firstChild);
        }
        prevRow = row;
      });

      // ลบแถวที่หลุด top
      rowByKey.forEach(function (el, k) {
        if (!seen.has(k)) { el.remove(); rowByKey.delete(k); }
      });

      // FLIP: เลื่อนจากตำแหน่งเดิม → ใหม่แบบลื่น
      rowByKey.forEach(function (el, k) {
        if (!firstPos.has(k)) return;
        var lastTop = el.getBoundingClientRect().top;
        var dy = firstPos.get(k) - lastTop;
        if (dy) {
          el.style.transition = 'none';
          el.style.transform = 'translateY(' + dy + 'px)';
          requestAnimationFrame(function () {
            el.style.transition = '';
            el.style.transform = '';
          });
        }
      });
    }

    // ?period=session|today|week|month|all — ไม่ใช่ session ให้ดึงสถิติสะสมจากเซิร์ฟเวอร์
    // (ยอดสะสมเป็นก้อนใหญ่และไม่ต้องอัปเดตทุกวินาที เลยใช้ HTTP ไม่ใช่ WebSocket)
    var PERIOD = params.get('period') || 'session';
    if (PERIOD !== 'session') {
      var base = 'http://' + (params.get('host') || location.hostname || 'localhost') +
                 ':' + (params.get('port') || location.port || 21213);
      var url = base + '/api/rollup?metric=diamonds&limit=' + topN + '&period=' + encodeURIComponent(PERIOD);
      var pull = function () {
        fetch(url).then(function (r) { return r.json(); })
          .then(function (d) { render((d && d.top) || []); })
          .catch(function () { /* เซิร์ฟเวอร์ยังไม่พร้อม — รอบหน้าค่อยลองใหม่ */ });
      };
      pull();
      setInterval(pull, 20000);
    }

    TikkiesWidget.connect({
      onEvent: function (event, data) {
        if (PERIOD !== 'session') return;   // โหมดสะสม: ไม่ให้ยอดของไลฟ์นี้มาทับ
        if (event === 'snapshot') return render(data && data.leaderboard && data.leaderboard.top);
        if (event === 'leaderboard') return render(data && data.top);
      }
    });
  })();
  </script>
</body>
</html>
